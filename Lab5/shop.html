<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Bookstore</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="shop.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

<!--

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header id="home">
        <h1>Campus Bookstore</h1>
        <p>Textbooks, stationery and more for every student.</p>
    </header>

    <!-- Main Content -->
    <main>

        <section id="books">

            <h2>Available Products</h2>

            <table id="product">

                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price (RM)</th>
                </tr>

                <tr>
                    <td>Web Design Basics</td>
                    <td>Textbook</td>
                    <td class="price">45.00</td>
                </tr>

                <tr>
                    <td>A4 Notebook</td>
                    <td>Stationery</td>
                    <td class="price">6.50</td>
                </tr>

                <tr>
                    <td>USB Drive 32GB</td>
                    <td>Gadget</td>
                    <td class="price">25.00</td>
                </tr>

                <tr>
                    <td>Highlighter Set</td>
                    <td>Stationery</td>
                    <td class="price">9.90</td>
                </tr>

            </table>

        </section>

    </main>

    <!-- Footer -->
    <footer id="contact">
        <p>&copy; 2026 Campus Bookstore</p>
    </footer>
